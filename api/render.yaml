# Render Blueprint — Web Service for SecureAI API
# Dashboard: New > Blueprint > connect this repo
# Or create a Web Service manually with Root Directory = api

services:
  - type: web
    name: secureai-api
    runtime: python
    rootDir: api
    plan: starter
    buildCommand: pip install -r requirements-render.txt
    startCommand: python run_api.py
    healthCheckPath: /health
    envVars:
      - key: ADMIN_INTERNAL_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: PYTHON_VERSION
        value: "3.12.8"
