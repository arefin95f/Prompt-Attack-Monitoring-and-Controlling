system:
  name: Prompt Injection Defense System
  version: 4.0.0
  description: 5-Layer Pipeline with Phase 1-5 upgrades
feature_flags:
  phase1_intent_preserving: true
  phase2_transformer: true
  phase3_llm_judge: true
  phase4_retrieval_normalization: true
  phase5_decision_logging: true
layers:
  layer1:
    enabled: true
    rules:
    - SYSTEM_OVERRIDE
    - JAILBREAK
    - SYSTEM_EXTRACTION
    - DATA_EXTRACTION
    - TOOL_INJECTION
    - DELIMITER_HIJACK
    - BASE64_ENCODING
    entropy_threshold: 7.0
    special_char_threshold: 0.3
  layer2:
    enabled: true
    models:
    - logistic
    - random_forest
    - xgboost
    - svm
    max_features: 15000
    ngram_range:
    - 1
    - 3
  layer2b:
    enabled: true
    # Semantic upgrade: try HuggingFace Deberta; falls back to heuristic cues if unavailable
    use_transformers: true
    model_name: protectai/deberta-v3-base-prompt-injection-v2
    threshold: 0.55
    gate_confidence_below: 0.75
    run_on_ambiguous: true
  layer3:
    enabled: true
    weights:
      logistic: 1.0
      random_forest: 1.0
      xgboost: 1.2
      svm: 0.9
    ambiguous_threshold: 0.65
    confidence_threshold: 0.8
  layer4:
    enabled: true
    use_real_llm: false
    model: openai/gpt-4o-mini
    timeout_sec: 12
    max_calls_per_minute: 20
    min_confidence_for_skip: 0.8
    ambiguous_only: true
  layer5:
    enabled: true
    intent_preserving: true
    use_llm_rewrite: false
    fidelity_threshold: 0.35
    clarify_threshold: 0.45
    templates:
      direct_injection: 4
      jailbreak: 5
      system_extraction: 5
      data_extraction: 5
      tool_injection: 5
      context_poisoning: 4
      multi_turn: 4
      obfuscation: 4
      default: 4
  retrieval:
    enabled: true
    bank_path: data/attack_bank.json
    threshold: 0.42
    top_k: 3
  normalizer:
    enabled: true
training:
  epochs: 3
  learning_rate: 2.0e-05
  batch_size: 8
  warmup_steps: 500
  early_stopping_patience: 2
  # Lab / review_queue rows count this many times more during Layer 2 fit
  team_sample_weight: 50
  team_sources:
    - review_queue
    - team_train
    - inbox_review
    - inbox_manual
data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  rate_limit: 1000
  timeout: 30
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: ./logs/app.log
  decisions_file: ./logs/decisions.jsonl
  rotation: daily
  retention: 30
rollout:
  mode: full
  percent: 100
  rollback_flags:
    phase2_transformer: false
    phase3_llm_judge: false
    phase4_retrieval_normalization: false
